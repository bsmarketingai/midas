<script type="text/x-dc" data-dc-script data-props='{"l1":{"editor":"text"},"h1":{"editor":"text"},"l2":{"editor":"text"},"h2":{"editor":"text"},"current":{"editor":"text"},"$preview":{"width":800,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const has = p.l1 !== undefined || p.current !== undefined;
    return {
      l1: p.l1 || (has ? '' : 'Kategorie'), h1: p.h1 || 'Kategorie.dc.html', l2: p.l2 || '', h2: p.h2 || 'Kategorie.dc.html',

    };
  }
}
