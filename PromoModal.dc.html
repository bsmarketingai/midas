<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Komponenta – Akční modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.pm{position:relative;box-sizing:border-box;width:560px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3);font:400 17px/1.5 Roboto,system-ui,sans-serif;color:rgba(30,30,30,.9)}
.pm *{box-sizing:border-box}
.pmImg{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;background:#eef1ee}
.pmClose{position:absolute;top:12px;right:12px;width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#1e1e1e;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pmClose:hover{background:#fff}
.pmClose:focus-visible{outline:2px solid #3a7a27;outline-offset:2px}
.pmClose svg{width:18px;height:18px}
.pmBody{padding:24px 28px 28px}
.pmBadge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:#cc0000;color:#fff;font-size:15px;font-weight:600}
.pmTitle{margin:12px 0 12px;padding:0 0 12px;border-bottom:1px solid #e9e9e9;font-size:29px;font-weight:700;line-height:1.2;color:#1e1e1e}
.pm.noImg .pmTitle{padding-right:44px}
.pmText{margin:0;font-size:18px;color:rgba(30,30,30,.8)}
.pmHi{display:flex;align-items:center;gap:14px;margin:18px 0 0;padding:14px 16px;border:1px solid #b7dba6;border-radius:8px;background:#eff8eb;color:#24521a}
.pmHi svg{flex:0 0 32px;width:32px;height:32px;color:#3a7a27}
.pmHiT{margin:0}
.pmHi b{display:block;font-size:20px;line-height:1.25;color:#1e1e1e}
.pmHi span{font-size:16px}
.pmNote{display:flex;gap:8px;margin:14px 0 0;font-size:15px;color:rgba(30,30,30,.63)}
.pmNote svg{flex:0 0 16px;width:16px;height:16px;margin-top:2px}
.pmBtns{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:22px}
.pmCta{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;border:0;border-radius:6px;background:#cc0000;color:#fff;font:600 18px/1 Roboto,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.pmCta:hover{background:#a80000;color:#fff}
.pmCta svg{width:16px;height:16px}
.pmCta:focus-visible,.pmLink:focus-visible{outline:2px solid #1e1e1e;outline-offset:2px}
.pmLink{display:inline-flex;align-items:center;gap:6px;color:#3a7a27;font-weight:500;text-decoration:none}
.pmLink:hover{text-decoration:underline;text-underline-offset:3px}
.pmLink svg{width:14px;height:14px}
@media (max-width:600px){.pmBody{padding:20px}.pmTitle{font-size:25px}.pmCta{width:100%;justify-content:center}}
</style>
</helmet>
<section class="pm {{ imgCls }}" aria-labelledby="pmTitle" onKeyDown="{{ key }}">
<sc-if value="{{ hasImg }}" hint-placeholder-val="{{ true }}"><img class="pmImg" src="_blob/e178af83aa9c5ae8d3279eb30f5f6d06.jpg" alt="Dodávka Midas s logem firmy"></sc-if>
<button class="pmClose" type="button" aria-label="Zavřít" onClick="{{ close }}" ref="{{ closeRef }}"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button>
<div class="pmBody">
<span class="pmBadge">Akce</span>
<h2 class="pmTitle" id="pmTitle">Doprava zdarma po celý listopad</h2>
<p class="pmText">Objednejte do konce listopadu a zboží vám dovezeme zdarma.</p>
<div class="pmHi"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M255.42,117l-14-35A15.93,15.93,0,0,0,226.58,72H192V64a8,8,0,0,0-8-8H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H49a32,32,0,0,0,62,0h50a32,32,0,0,0,62,0h17a16,16,0,0,0,16-16V120A7.94,7.94,0,0,0,255.42,117ZM192,88h34.58l9.6,24H192ZM32,72H176v64H32ZM80,208a16,16,0,1,1,16-16A16,16,0,0,1,80,208Zm81-24H111a32,32,0,0,0-62,0H32V152H176v12.31A32.11,32.11,0,0,0,161,184Zm31,24a16,16,0,1,1,16-16A16,16,0,0,1,192,208Zm48-24H223a32.06,32.06,0,0,0-31-24V128h48Z"></path></svg><p class="pmHiT"><b>Doprava zdarma nad 2 500 Kč</b><span>hodnota objednávky včetně DPH</span></p></div>
<p class="pmNote"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z"></path></svg><span>Neplatí pro zboží s příznakem Nadrozměr a pro registrované zákazníky.</span></p>
<div class="pmBtns"><button class="pmCta" type="button" onClick="{{ close }}">Nakupovat<svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg></button><a class="pmLink" href="Doprava.dc.html">Podmínky dopravy<svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg></a></div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"image":{"editor":"boolean","default":true,"section":"Hlavička"},"onClose":{"editor":null},"$preview":{"width":560,"height":620}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.closeRef = el => { this.closeEl = el; }; }
  componentDidMount() { if (this.props.onClose && this.closeEl) this.closeEl.focus(); }
  renderVals() {
    const p = this.props;
    const img = !(p.image === false || p.image === 'false');
    const close = () => { if (p.onClose) p.onClose(); };
    return {
      hasImg: img, imgCls: img ? '' : 'noImg', close, closeRef: this.closeRef,
      key: e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
    };
  }
}
</script>
</body>
</html>
