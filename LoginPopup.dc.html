<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Komponenta – Přihlášení</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.lp{position:relative;box-sizing:border-box;width:320px;max-width:100%;display:flex;flex-direction:column;gap:12px;padding:24px;background:#fff;border:1px solid #e1e1e1;border-radius:8px;box-shadow:0 18px 40px rgba(24,36,18,.16),0 2px 6px rgba(24,36,18,.06);font:400 15px/1.45 Roboto,system-ui,sans-serif;color:rgba(30,30,30,.9);text-align:left}
.lp *{box-sizing:border-box}
.lpTitle{margin:0 40px 4px 0;font-size:18px;font-weight:700;line-height:1.3}
.lpClose{position:absolute;top:8px;right:8px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:6px;background:transparent;color:rgba(30,30,30,.9);cursor:pointer}
.lpClose:hover{background:#f2f2f2}
.lpClose:focus-visible,.lpEye:focus-visible{outline:2px solid #3a7a27;outline-offset:1px}
.lpClose svg{width:18px;height:18px}
.lpLabel{display:block;margin:0 0 -6px;font-size:13px;font-weight:500}
.lpField{position:relative;display:flex}
.lpField > svg{position:absolute;left:12px;top:50%;width:18px;height:18px;translate:0 -50%;color:#8a8a8a;pointer-events:none}
.lpField input{width:100%;height:44px;padding:0 14px 0 40px;font:inherit;font-size:16px;color:inherit;background:#fff;border:1px solid #d2d7d9;border-radius:4px;appearance:none}
.lpField input:focus{outline:none;border-color:#3a7a27;box-shadow:0 0 0 3px rgba(101,188,71,.25)}
.lpField input[aria-invalid="true"]{border-color:#cc0000}
.lpField.pw input{padding-right:48px}
.lpEye{position:absolute;right:2px;top:2px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:4px;background:transparent;color:#5c5c5c;cursor:pointer}
.lpEye:hover{color:#1e1e1e}
.lpEye svg{width:20px;height:20px}
.lpErr{margin:-2px 0 0;font-size:13px;color:#b00000}
.lpBtn{height:44px;margin-top:4px;padding:0 20px;font:600 15px/1 Roboto,system-ui,sans-serif;color:#fff;background:#cc0000;border:0;border-radius:6px;cursor:pointer}
.lpBtn:hover{background:#a80000}
.lpBtn:focus-visible{outline:2px solid #1e1e1e;outline-offset:2px}
.lpCheck{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:32px;font-size:14px;cursor:pointer;user-select:none}
.lpCheck input{position:absolute;opacity:0;width:20px;height:20px;margin:0}
.lpBox{flex:0 0 20px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;border:2px solid #b9c0c3;border-radius:3px;background:#fff;color:#fff}
.lpBox svg{width:14px;height:14px;opacity:0}
.lpCheck input:checked + .lpBox{background:#3a7a27;border-color:#3a7a27}
.lpCheck input:checked + .lpBox svg{opacity:1}
.lpCheck input:focus-visible + .lpBox{outline:2px solid #3a7a27;outline-offset:2px}
.lpLinks{display:flex;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid #e9e9e9;font-size:14px}
.lpLinks a{color:#3a7a27;font-weight:500;text-decoration:none}
.lpLinks a:hover{text-decoration:underline;text-underline-offset:3px}
.lpDone{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding-top:4px}
.lpDone svg.ok{width:36px;height:36px;color:#3a7a27}
.lpDone p{margin:0;font-size:14px;color:rgba(30,30,30,.72)}
.lpDone .lpBtn{align-self:stretch}
</style>
</helmet>
<form class="lp" novalidate="" onSubmit="{{ submit }}" onKeyDown="{{ key }}" aria-labelledby="lpTitle">
<button class="lpClose" type="button" aria-label="Zavřít přihlášení" onClick="{{ close }}"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button>
<sc-if value="{{ form }}" hint-placeholder-val="{{ true }}">
<h2 class="lpTitle" id="lpTitle">Přihlášení</h2>
<label class="lpLabel" for="lpEmail">E-mail</label>
<div class="lpField"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"></path></svg><input id="lpEmail" type="email" autocomplete="username" placeholder="jmeno@firma.cz" value="{{ email }}" onChange="{{ setEmail }}" aria-invalid="{{ emailInv }}" ref="{{ emailRef }}"></div>
<label class="lpLabel" for="lpPass">Heslo</label>
<div class="lpField pw"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z"></path></svg><input id="lpPass" type="{{ passType }}" autocomplete="current-password" placeholder="Vaše heslo" value="{{ pass }}" onChange="{{ setPass }}" aria-invalid="{{ passInv }}"><button class="lpEye" type="button" aria-label="{{ eyeLabel }}" aria-pressed="{{ eyePressed }}" onClick="{{ toggleEye }}"><sc-if value="{{ showPass }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M53.92,34.62A8,8,0,1,0,42.08,45.38L61.32,66.55C25,88.84,9.38,123.2,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208a127.11,127.11,0,0,0,52.07-10.83l22,24.21a8,8,0,1,0,11.84-10.76Zm47.33,75.84,41.67,45.85a32,32,0,0,1-41.67-45.85ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.16,133.16,0,0,1,25,128c4.69-8.79,19.66-33.39,47.35-49.38l18,19.75a48,48,0,0,0,63.66,70l14.73,16.2A112,112,0,0,1,128,192Zm6-95.43a8,8,0,0,1,3-15.72,48.16,48.16,0,0,1,38.77,42.64,8,8,0,0,1-7.22,8.71,6.39,6.39,0,0,1-.75,0,8,8,0,0,1-8-7.26A32.09,32.09,0,0,0,134,96.57Zm113.28,34.69c-.42.94-10.55,23.37-33.36,43.8a8,8,0,1,1-10.67-11.92A132.77,132.77,0,0,0,231.05,128a133.15,133.15,0,0,0-23.12-30.77C185.67,75.19,158.78,64,128,64a118.37,118.37,0,0,0-19.36,1.57A8,8,0,1,1,106,49.79,134,134,0,0,1,128,48c34.88,0,66.57,13.26,91.66,38.35,18.83,18.83,27.3,37.62,27.65,38.41A8,8,0,0,1,247.31,131.26Z"></path></svg></sc-if><sc-if value="{{ hidePass }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"></path></svg></sc-if></button></div>
<sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}"><p class="lpErr" role="alert">{{ err }}</p></sc-if>
<button class="lpBtn" type="submit">Přihlásit se</button>
<label class="lpCheck"><input type="checkbox" checked="{{ remember }}" onChange="{{ toggleRemember }}"><span class="lpBox"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></span><span>Zůstat přihlášen</span></label>
<div class="lpLinks"><a href="#">Zapomenuté heslo?</a><a href="#">Nová registrace</a></div>
</sc-if>
<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div class="lpDone" role="status">
<svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path></svg>
<h2 class="lpTitle" id="lpTitle">Jste přihlášen</h2>
<p>{{ email }} · ceny se teď zobrazují podle vašich obchodních podmínek.</p>
<button class="lpBtn" type="button" onClick="{{ close }}">Pokračovat v nákupu</button>
</div>
</sc-if>
</form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"onLogin":{"editor":null},"$preview":{"width":320,"height":420}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', pass: '', show: false, remember: true, err: '', bad: '', done: false };
    this.emailRef = el => { this.emailEl = el; };
  }
  componentDidMount() { if (this.props.onClose && this.emailEl) this.emailEl.focus(); }
  renderVals() {
    const s = this.state;
    const close = () => { if (this.props.onClose) this.props.onClose(); };
    return {
      form: !s.done, done: s.done, email: s.email, pass: s.pass, remember: s.remember,
      passType: s.show ? 'text' : 'password', showPass: s.show, hidePass: !s.show,
      eyeLabel: s.show ? 'Skrýt heslo' : 'Zobrazit heslo', eyePressed: String(s.show),
      hasErr: !!s.err, err: s.err, emailInv: String(s.bad === 'email'), passInv: String(s.bad === 'pass'),
      emailRef: this.emailRef, close,
      setEmail: e => this.setState({ email: e.target.value, err: s.bad === 'email' ? '' : s.err, bad: s.bad === 'email' ? '' : s.bad }),
      setPass: e => this.setState({ pass: e.target.value, err: s.bad === 'pass' ? '' : s.err, bad: s.bad === 'pass' ? '' : s.bad }),
      toggleEye: () => this.setState({ show: !s.show }),
      toggleRemember: e => this.setState({ remember: e.target.checked }),
      key: e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } },
      submit: e => {
        e.preventDefault();
        const em = s.email.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { this.setState({ err: 'Zadejte e-mail ve tvaru jmeno@firma.cz.', bad: 'email' }); return; }
        if (s.pass.length < 4) { this.setState({ err: 'Zadejte heslo (alespoň 4 znaky).', bad: 'pass' }); return; }
        this.setState({ done: true, err: '', bad: '', email: em });
        if (this.props.onLogin) this.props.onLogin(em);
      }
    };
  }
}
</script>
</body>
</html>
