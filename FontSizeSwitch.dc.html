<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Komponenta – Velikost písma (prezentace)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
.fsw{--fsw-primary:#3a7a27;--fsw-primary-10:#eff8eb;--fsw-line:#e1e1e1;--fsw-text:rgba(30,30,30,.9);--fsw-muted:rgba(30,30,30,.63);--fsw-radius:8px;--fsw-pill:999px;--fsw-shadow:0 12px 32px rgba(24,36,18,.18),0 2px 6px rgba(24,36,18,.08);position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + var(--fsw-lift,0px));z-index:1050;font:400 14px/1.4 Roboto,system-ui,sans-serif;color:var(--fsw-text)}
.fsw *{box-sizing:border-box}
.fswBtn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 12px;border:1px solid var(--fsw-line);border-radius:var(--fsw-pill);background:#fff;color:var(--fsw-text);font:500 14px/1 Roboto,system-ui,sans-serif;box-shadow:var(--fsw-shadow);cursor:pointer;transition:border-color .15s,background-color .15s}
.fswBtn:hover{border-color:var(--fsw-primary);background:var(--fsw-primary-10)}
.fswBtn:focus-visible,.fswOpt:focus-visible{outline:2px solid var(--fsw-primary);outline-offset:2px}
.fswBtn .ic{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--fsw-primary);color:#fff}
.fswBtn .ic svg{width:20px;height:20px}
.fswBtn .val{color:var(--fsw-muted);font-weight:400}
.fswMenu{position:absolute;left:0;bottom:calc(100% + 8px);width:280px;max-height:calc(100vh - 96px);overflow:auto;padding:8px;border:1px solid var(--fsw-line);border-radius:var(--fsw-radius);background:#fff;box-shadow:var(--fsw-shadow)}
.fswGrp + .fswGrp{margin-top:8px;padding-top:8px;border-top:1px solid var(--fsw-line)}
.fswOpt .smp svg{width:18px;height:18px}
.fswOpt .smp.mono{font-size:12px;letter-spacing:.02em}
.fswH{margin:4px 8px 8px;font-size:13px;font-weight:500;color:var(--fsw-muted)}
.fswOpt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px;border:0;border-radius:6px;background:transparent;color:var(--fsw-text);font:inherit;text-align:left;cursor:pointer}
.fswOpt:hover{background:var(--fsw-primary-10)}
.fswOpt .smp{flex:0 0 32px;display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--fsw-line);border-radius:6px;font-weight:700;line-height:1}
.fswOpt .smp.s{font-size:13px}
.fswOpt .smp.l{font-size:17px}
.fswOpt .t{flex:1}
.fswOpt .t b{display:block;font-weight:500}
.fswOpt .t small{display:block;font-size:12px;color:var(--fsw-muted)}
.fswOpt .ok{width:18px;height:18px;color:var(--fsw-primary);opacity:0}
.fswOpt[aria-checked="true"]{background:var(--fsw-primary-10)}
.fswOpt[aria-checked="true"] .smp{border-color:var(--fsw-primary);color:var(--fsw-primary)}
.fswOpt[aria-checked="true"] .ok{opacity:1}
/* plovoucí ikonové tlačítko – nezakrývá obsah (např. tlačítko Zpět v objednávce); stav je v title a pro čtečky skrytě v textu */
.fswBtn{width:48px;padding:0;justify-content:center;border-radius:50%}
.fswBtn .lbl,.fswBtn .val{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fswBtn{transition:none}}
</style>
</helmet>
<div class="fsw" data-fsw="" role="region" aria-label="Prezentační nastavení" onKeyDown="{{ key }}" ref="{{ rootRef }}">
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div class="fswMenu" id="fswMenu">
<div class="fswGrp" role="radiogroup" aria-labelledby="fswH2">
<p class="fswH" id="fswH2">Zákazník</p>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ outOn }}" onClick="{{ setOut }}"><span class="smp" aria-hidden="true"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"></path></svg></span><span class="t"><b>Nepřihlášen</b><small>Návštěvník bez účtu</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ inOn }}" onClick="{{ setIn }}"><span class="smp mono" aria-hidden="true">AZ</span><span class="t"><b>Přihlášen</b><small>Andrea Zelená · Prodejní</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
</div>
<div class="fswGrp" role="radiogroup" aria-labelledby="fswH3">
<p class="fswH" id="fswH3">Hero na úvodní stránce</p>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ hAOn }}" onClick="{{ setHA }}"><span class="smp" aria-hidden="true">A</span><span class="t"><b>Varianta A</b><small>Přepínače s popisky, na mobilu akordeon</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ hBOn }}" onClick="{{ setHB }}"><span class="smp" aria-hidden="true">B</span><span class="t"><b>Varianta B</b><small>Jednoduchý karusel, na mobilu přes celou šíři</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ hCOn }}" onClick="{{ setHC }}"><span class="smp" aria-hidden="true">C</span><span class="t"><b>Varianta C</b><small>Karusel B přes celou šíři okna, zapne i menu B</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
</div>
<div class="fswGrp" role="radiogroup" aria-labelledby="fswH4">
<p class="fswH" id="fswH4">Menu kategorií</p>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ mAOn }}" onClick="{{ setMA }}"><span class="smp" aria-hidden="true">A</span><span class="t"><b>Varianta A</b><small>Zelený box v šíři obsahu (s hero A nebo B)</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ mBOn }}" onClick="{{ setMB }}"><span class="smp" aria-hidden="true">B</span><span class="t"><b>Varianta B</b><small>Na desktopu přes celou šíři okna</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
</div>
<div class="fswGrp" role="radiogroup" aria-labelledby="fswH5">
<p class="fswH" id="fswH5">USP (výhody pod hero)</p>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ uAOn }}" onClick="{{ setUA }}"><span class="smp" aria-hidden="true">A</span><span class="t"><b>Varianta A</b><small>Box s rámečkem v šíři obsahu</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
<button class="fswOpt" type="button" role="radio" aria-checked="{{ uBOn }}" onClick="{{ setUB }}"><span class="smp" aria-hidden="true">B</span><span class="t"><b>Varianta B</b><small>Přes celou šíři, jen spodní oddělovač</small></span><svg class="ok" viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg></button>
</div>
</div>
</sc-if>
<button class="fswBtn" type="button" title="Prezentace: {{ curLabel }}" aria-haspopup="true" aria-expanded="{{ openStr }}" aria-controls="fswMenu" onClick="{{ toggle }}"><span class="ic"><svg viewBox="0 0 256 256" aria-hidden="true" fill="currentColor"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"></path></svg></span><span class="lbl">Prezentace:</span><span class="val">{{ curLabel }}</span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":260}}'>
/* Prezentační přepínač: stav zákazníka (nepřihlášen / přihlášen), varianta hero na úvodu (A / B / C) varianta menu kategorií (A / B) a varianta USP (A / B). Pamatuje se napříč stránkami (localStorage).
   Velikost písma už se nepřepíná – „Velké“ je od 23. 11. 2026 výchozí velikost webu (rozhodnutí klienta, zapečeno v tokenech). */
const AUTH = 'midasAuthV1', HERO = 'midasHeroV1', MENU = 'midasMenuV1', USP = 'midasUspV1';
const applyMenu = v => { try { if (v === 'B') document.documentElement.dataset.menu = 'B'; else delete document.documentElement.dataset.menu; } catch (e) {} };
/* --vw: šíře okna bez svislého scrollbaru pro full-bleed prvky (100vw scrollbar zahrnuje → vodorovné přetečení). */
const syncVw = () => { try { const de = document.documentElement; de.style.setProperty('--vw', de.clientWidth + 'px'); const oap = document.querySelector('.OrderActionPanelRwdView'); de.style.setProperty('--fsw-lift', oap && getComputedStyle(oap).position === 'fixed' ? Math.round(oap.getBoundingClientRect().height) + 'px' : '0px'); } catch (e) {} }; /* --fsw-lift: tlačítko Prezentace nad spodní lištou objednávky */
if (typeof window !== 'undefined' && !window.__midasVw) { window.__midasVw = true; syncVw(); window.addEventListener('resize', syncVw); try { new ResizeObserver(syncVw).observe(document.documentElement); } catch (e) {} }
/* Vyhledávání v hlavičce (#q, #qm): placeholder „píše“ ukázkové dotazy. Stojí, když je pole aktivní nebo vyplněné,
   při skryté záložce a při prefers-reduced-motion (pak zůstane výchozí text). Na každé stránce běží jen jednou. */
const QS_DEMO = ['Drenáže a chráničky', 'KG koleno DN 110'];
if (typeof window !== 'undefined' && !window.__midasQsType) { window.__midasQsType = true;
  const base = 'Zadejte hledaný výraz...';
  const reduced = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const inputs = () => ['q', 'qm'].map(id => document.getElementById(id)).filter(Boolean);
  const idle = () => !document.hidden && inputs().every(el => document.activeElement !== el && !el.value);
  const put = t => inputs().forEach(el => { if (document.activeElement !== el && !el.value) el.setAttribute('placeholder', t); });
  let w = 0, i = 0, dir = 1;
  const tick = () => { let wait = 70;
    if (!idle()) { inputs().forEach(el => el.setAttribute('placeholder', base)); w = 0; i = 0; dir = 1; wait = 600; }
    else { const word = QS_DEMO[w]; i += dir; put(i > 0 ? word.slice(0, i) + '|' : base);
      if (dir > 0 && i >= word.length) { dir = -1; wait = 1800; }
      else if (dir < 0 && i <= 0) { dir = 1; w = (w + 1) % QS_DEMO.length; wait = 900; put(base); }
      else wait = dir > 0 ? 75 : 35; }
    setTimeout(tick, wait); };
  if (!reduced) { setTimeout(tick, 1500); document.addEventListener('focusin', e => { if (e.target && (e.target.id === 'q' || e.target.id === 'qm')) e.target.setAttribute('placeholder', base); }); }
}
const applyUsp = v => { try { if (v === 'B') document.documentElement.dataset.usp = 'B'; else delete document.documentElement.dataset.usp; } catch (e) {} };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let auth = false;
    try { auth = localStorage.getItem(AUTH) !== 'out'; } catch (e) {}
    let hero = 'A';
    try { const r = localStorage.getItem(HERO); hero = r === 'A' || r === 'B' ? r : 'C'; } catch (e) {}
    let menu = 'A';
    try { menu = localStorage.getItem(MENU) === 'A' ? 'A' : 'B'; } catch (e) {}
    applyMenu(menu);
    if (menu === 'B') setTimeout(() => window.dispatchEvent(new Event('resize')), 0); /* stránka po načtení přepočte menu B */
    let usp = 'A';
    try { usp = localStorage.getItem(USP) === 'A' ? 'A' : 'B'; } catch (e) {}
    applyUsp(usp);
    this.state = { open: false, auth, hero, menu, usp };
    this.onAuth = () => { let v = false, h = 'A', m = 'A', u = 'A'; try { v = localStorage.getItem(AUTH) !== 'out'; const r = localStorage.getItem(HERO); h = r === 'A' || r === 'B' ? r : 'C'; m = localStorage.getItem(MENU) === 'A' ? 'A' : 'B'; u = localStorage.getItem(USP) === 'A' ? 'A' : 'B'; } catch (e) {} if (u !== this.state.usp) { applyUsp(u); this.setState({ usp: u }); } if (m !== this.state.menu) { applyMenu(m); window.dispatchEvent(new Event('resize')); } if (v !== this.state.auth || h !== this.state.hero || m !== this.state.menu) this.setState({ auth: v, hero: h, menu: m }); };
    this.rootRef = el => { this.rootEl = el; };
    this.onDoc = e => { if (this.state.open && this.rootEl && !this.rootEl.contains(e.target)) this.setState({ open: false }); };
  }
  componentDidMount() {
    try { localStorage.removeItem('midasFontSizeV1'); } catch (e) {}
    document.addEventListener('pointerdown', this.onDoc);
    window.addEventListener('midas-auth', this.onAuth);
    window.addEventListener('midas-hero', this.onAuth);
    window.addEventListener('storage', this.onAuth);
  }
  componentWillUnmount() {
    document.removeEventListener('pointerdown', this.onDoc);
    window.removeEventListener('midas-auth', this.onAuth);
    window.removeEventListener('midas-hero', this.onAuth);
    window.removeEventListener('storage', this.onAuth);
  }
  setAuth(v) {
    try { localStorage.setItem(AUTH, v ? 'in' : 'out'); } catch (e) {}
    this.setState({ auth: v, open: false });
    window.dispatchEvent(new Event('midas-auth'));
  }
  setHero(v) {
    try { localStorage.setItem(HERO, v); } catch (e) {}
    this.setState({ hero: v, open: false });
    window.dispatchEvent(new Event('midas-hero'));
    if (v === 'C' && this.state.menu !== 'B') this.setMenu('B'); /* hero C (full-bleed) dává smysl jen s full-bleed menu B */
  }
  setMenu(v) {
    if (v === 'A' && this.state.hero === 'C') this.setHero('B'); /* menu A s hero C nejde dohromady → hero přepne na B */
    try { localStorage.setItem(MENU, v); } catch (e) {}
    applyMenu(v);
    this.setState({ menu: v, open: false });
    window.dispatchEvent(new Event('resize'));
  }
  setUsp(v) {
    try { localStorage.setItem(USP, v); } catch (e) {}
    applyUsp(v);
    this.setState({ usp: v, open: false });
  }
  renderVals() {
    const s = this.state;
    return {
      open: s.open, openStr: String(s.open), rootRef: this.rootRef,
      curLabel: (s.auth ? 'přihlášen' : 'nepřihlášen') + ' · hero ' + s.hero + ' · menu ' + s.menu + ' · USP ' + s.usp,
      uAOn: String(s.usp === 'A'), uBOn: String(s.usp === 'B'), setUA: () => this.setUsp('A'), setUB: () => this.setUsp('B'),
      mAOn: String(s.menu === 'A'), mBOn: String(s.menu === 'B'), setMA: () => this.setMenu('A'), setMB: () => this.setMenu('B'),
      hAOn: String(s.hero === 'A'), hBOn: String(s.hero === 'B'), setHA: () => this.setHero('A'), setHB: () => this.setHero('B'), hCOn: String(s.hero === 'C'), setHC: () => this.setHero('C'),
      outOn: String(!s.auth), inOn: String(s.auth),
      setOut: () => this.setAuth(false), setIn: () => this.setAuth(true),
      toggle: () => this.setState({ open: !s.open }),
      key: e => { if (e.key === 'Escape' && s.open) { e.stopPropagation(); this.setState({ open: false }); } }
    };
  }
}
</script>
</body>
</html>
