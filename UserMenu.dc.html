<style>
body{margin:0}
.um{position:relative;box-sizing:border-box;width:320px;max-width:100%;padding:8px;background:#fff;border:1px solid #e1e1e1;border-radius:8px;box-shadow:0 18px 40px rgba(24,36,18,.16),0 2px 6px rgba(24,36,18,.06);font:400 17px/1.45 Roboto,system-ui,sans-serif;color:rgba(30,30,30,.9);text-align:left}
.um *{box-sizing:border-box}
.umHead{display:flex;align-items:center;gap:12px;padding:12px 72px 12px 12px}
.umMono{flex:0 0 44px;display:grid;place-items:center;width:44px;height:44px;border-radius:var(--radius-md,6px);background:#3a7a27;color:#fff;font-weight:700;font-size:18px;letter-spacing:.02em}
.umName{margin:0;font-size:19px;font-weight:700;line-height:1.25}
.umGroup{margin:2px 0 0;font-size:15px;color:rgba(30,30,30,.66)}
.umGroup b{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:4px;background:#eff8eb;color:#245a17;font-weight:600}
.umClose{position:absolute;top:21px;right:16px;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:6px;background:transparent;color:rgba(30,30,30,.9);cursor:pointer}
.umClose:hover{background:#f2f2f2}
.umClose svg{width:24px;height:24px}
.umList{list-style:none;margin:4px 0 0;padding:4px 0 0;border-top:1px solid #e9e9e9}
.umList a,.umOut{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:6px;background:transparent;color:rgba(30,30,30,.9);font:inherit;text-decoration:none;text-align:left;cursor:pointer}
.umList a:hover{background:#eff8eb;color:#245a17}
.umList .ic,.umOut .ic{flex:none;width:20px;height:20px;color:#3a7a27}
.umList span{flex:1}
.umList .go{flex:none;width:14px;height:14px;opacity:.5}
.umFoot{margin-top:4px;padding-top:4px;border-top:1px solid #e9e9e9}
.umOut{color:#b00000;font-weight:500}
.umOut .ic{color:#b00000}
.umOut:hover{background:#fdecea}
.um a:focus-visible,.um button:focus-visible{outline:2px solid #3a7a27;outline-offset:1px}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"userName":{"editor":"text","default":"Andrea Zelená"},"group":{"editor":"text","default":"Prodejní"},"onClose":{"editor":null},"onLogout":{"editor":null},"$preview":{"width":320,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const n = this.props.userName ?? 'Andrea Zelená';
    const mono = n.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const close = () => { if (this.props.onClose) this.props.onClose(); };
    return {
      userName: n, mono, group: this.props.group ?? 'Prodejní', close,
      logout: () => { if (this.props.onLogout) this.props.onLogout(); else close(); },
      key: e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
    };
  }
}
</script>
